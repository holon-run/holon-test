name: Holon Solve Smoke

on:
  workflow_dispatch:
    inputs:
      ref:
        description: GitHub issue or PR ref to pass to holon solve.
        required: true
        default: holon-run/holon-test#44
      goal:
        description: Smoke-test goal.
        required: true
        default: Inspect the target and write a concise smoke-test summary only. Do not edit files, push branches, open PRs, or close issues.
      model:
        description: Holon model ref.
        required: false
        default: anthropic/claude-sonnet-4-6

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  solve:
    uses: holon-run/holon/.github/workflows/holon-solve.yml@restore-third-party-workflow
    with:
      ref: ${{ inputs.ref }}
      goal: ${{ inputs.goal }}
      model: ${{ inputs.model }}
      build_from_source: true
      holon_ref: restore-third-party-workflow
    secrets: inherit
